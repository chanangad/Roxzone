<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Roxzone Purchase Complete</title>
  <link rel="canonical" href="https://roxzone.app/">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="../">ROXZONE</a>
    <nav class="topbar__nav">
      <span class="topbar__tab topbar__tab--active">Store</span>
    </nav>
  </header>

  <main class="page-shell">
    <section class="panel panel--narrow">
      <h1 class="panel__title">Payment Complete</h1>
      <p id="success-copy" class="page-copy">
        Confirming your payment with the backend. Please keep this page open for a moment.
      </p>
      <p id="success-status" class="helper-note helper-note--ok">
        Finalizing checkout...
      </p>
      <div class="action-row">
        <a class="action-link action-link--primary" href="../">Back to Home</a>
      </div>
    </section>
  </main>
  <script src="../app.js"></script>
  <script>
    const successCopy = document.getElementById("success-copy");
    const successStatus = document.getElementById("success-status");

    const paypalToken = query("token").trim();
    const dodoClaimCode = query("code").trim().toUpperCase();
    const razorpayPaymentId = query("razorpay_payment_id").trim();
    const razorpayClaimCode = query("razorpay_payment_link_reference_id").trim().toUpperCase();
    const claimCode = dodoClaimCode || razorpayClaimCode;

    function setMessage(copy, status, kind) {
      successCopy.innerHTML = copy;
      successStatus.textContent = status;
      successStatus.className = `helper-note helper-note--${kind}`;
    }

    async function pollLicensePaid(code) {
      const maxAttempts = 10;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        try {
          const response = await fetch(`${API_BASE}/api/license/status?code=${encodeURIComponent(code)}`);
          if (response.ok) {
            const data = await response.json();
            if (data && data.licenseState === "paid") {
              return true;
            }
          }
        } catch (_) {
          // ignore and retry
        }
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
      return false;
    }

    async function finalizeCheckout() {
      if (paypalToken) {
        try {
          await postJson("/api/paypal/capture-order", {orderId: paypalToken});
          setMessage(
            "Your payment is confirmed. Return to the watch app and choose <strong>Refresh License</strong>.",
            "PayPal payment captured successfully.",
            "ok"
          );
        } catch (error) {
          setMessage(
            "We could not finalize the PayPal payment automatically yet. Return to the watch app and try <strong>Refresh License</strong> once more in a few seconds.",
            error.message,
            "warn"
          );
        }
        return;
      }

      if (claimCode) {
        setMessage(
          "Thanks for your purchase. Confirming with our servers…",
          "Waiting for payment confirmation…",
          "ok"
        );
        const paid = await pollLicensePaid(claimCode);
        if (paid) {
          setMessage(
            "Your payment is confirmed. Return to the watch app and choose <strong>Refresh License</strong>.",
            "Payment confirmed.",
            "ok"
          );
        } else {
          setMessage(
            "Your payment was received but our servers are still finalizing it. Return to the watch app and try <strong>Refresh License</strong> in a minute.",
            "Still finalizing — the webhook may take a few extra seconds.",
            "warn"
          );
        }
        return;
      }

      setMessage(
        "This page works best when opened after a checkout redirect.",
        "No payment reference was found in the URL.",
        "warn"
      );
    }

    finalizeCheckout();
  </script>
</body>
</html>
